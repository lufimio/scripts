# =============================================================================
# Splunk Transforms Configuration
# =============================================================================
# This file contains transform rules for sourcetype extraction and routing
# Location: /opt/splunk/etc/system/local/transforms.conf
#
# Created for CCDC Competition
# =============================================================================

# Drop noisy application HTTP request logs that forward to syslog.
# nopcommerce / ASP.NET Core logs every HTTP request to journald which ends up in syslog;
# this is useless for security monitoring and accounts for the majority of syslog volume.
[drop_aspnet_syslog]
REGEX = (?:Microsoft\.AspNetCore|System\.Net\.Http\.HttpClient|info:\s+\S+\[(?:1|2)\]\s+(?:Request|Response|Route|Sending))
DEST_KEY = queue
FORMAT = nullQueue

# Extract IPTables logs to separate sourcetype
# Looks for "IPT-" pattern in kern.log and messages, routes to sourcetype=iptables
[extract_iptables_to_sourcetype]
REGEX = (?:IPT|FW)-\w+
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::iptables
