# Drop this file on the Splunk INDEXER (or heavy forwarder) at:
#   /opt/splunk/etc/system/local/props.conf
#   -- OR --
#   /opt/splunk/etc/apps/<your_app>/local/props.conf
#
# Restart Splunk after placing it: systemctl restart Splunkd
# This tells Splunk how to parse the JSON lines written by all CCDC thrunting scripts.

[ccdc_changes]
# One JSON object per line
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)

# Parse timestamp from the "ts" field
TIME_PREFIX = "ts":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25

# Extract all JSON fields automatically
KV_MODE = none
INDEXED_EXTRACTIONS = json

# The "host" field in the JSON is the remote machine's hostname.
# Rename it so it doesn't collide with Splunk's built-in host field.
FIELDALIAS-ccdc_host = host AS ccdc_host
