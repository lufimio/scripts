# Drop this file at:
#   /opt/splunkforwarder/etc/system/local/inputs.conf
#
# push-splunk-inputs.sh deploys it to every lin host automatically.
#
# Index: "linux" — matches CCDC-SOC dashboard queries (index=linux)

# --- CCDC structured JSON findings (securitySweep, fim, suidCleanup, pamAudit) ---
[monitor:///var/log/ccdc/changes.log]
sourcetype = ccdc_changes
index = linux
disabled = false
followTail = 0

# --- auditd kernel events ---
# sourcetype=linux:audit matches the CCDC-SOC FIM and threat hunting dashboards
[monitor:///var/log/audit/audit.log]
sourcetype = linux:audit
index = linux
disabled = false

# --- syslog (catches our logger -t ccdc-* entries + kern.log for iptables) ---
[monitor:///var/log/syslog]
sourcetype = syslog
index = linux
disabled = false

[monitor:///var/log/kern.log]
sourcetype = syslog
index = linux
disabled = false

[monitor:///var/log/messages]
sourcetype = syslog
index = linux
disabled = false

# --- auth events (SSH, sudo, PAM) ---
# sourcetype=linux_secure matches CCDC-SOC auth and FIM dashboards
[monitor:///var/log/auth.log]
sourcetype = linux_secure
index = linux
disabled = false

[monitor:///var/log/secure]
sourcetype = linux_secure
index = linux
disabled = false
